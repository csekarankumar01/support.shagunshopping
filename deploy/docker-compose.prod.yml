# Production overrides. Use together with the main file:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# What changes compared with development:
#   * Postgres, Redis, Redpanda and the apps are NOT published on the host: only Caddy (80/443) is reachable.
#   * Mailpit is not started: email goes to a real SMTP provider (SMTP_* in .env).
#   * HTTPS, and cookies marked Secure, with the real domain names.
#   * Container logs are rotated so a disk cannot fill up.
# Needs Docker Compose 2.24 or newer (for the !reset and !override tags).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    ports: !reset []
    logging: *logging
  redis:
    ports: !reset []
    logging: *logging
  redpanda:
    ports: !reset []
    logging: *logging
  mailpit:
    profiles: ["development"] # never started in production

  backend:
    ports: !reset []
    logging: *logging
    environment:
      FRONTEND_ORIGIN: https://${APP_DOMAIN:?set APP_DOMAIN in .env}
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    ports: !reset []
    logging: *logging
    build:
      args:
        NEXT_PUBLIC_SOCKET_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
    deploy:
      resources:
        limits:
          memory: 512M

  migrate:
    logging: *logging

  caddy:
    image: caddy:2
    container_name: helpdesk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
