name: shagun-helpdesk

services:
  postgres:
    image: postgres:17
    container_name: shagun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - shagun_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: shagun-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - shagun_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    container_name: shagun-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_PORT}
    ports:
      - "${KAFKA_PORT}:19092"
    volumes:
      - shagun_redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    container_name: shagun-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT}:1025"
      - "${MAIL_UI_PORT}:8025"

  migrate:
    build: ./helpdesk-backend
    container_name: shagun-migrate
    command: ["node", "db/migrate.mjs"]
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./helpdesk-backend
    container_name: shagun-backend
    restart: unless-stopped
    environment:
      PORT: "5310"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS}
      PLATFORM_REQUIRE_2FA: ${PLATFORM_REQUIRE_2FA:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: redpanda:9092
      SMTP_HOST: ${SMTP_RELAY_HOST:-mailpit}
      SMTP_PORT: ${SMTP_RELAY_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-support@shagunshopping.com}
      SMTP_TLS: ${SMTP_TLS:-none}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5311}
      TRUST_PROXY: "1"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "${PORT:-5310}:5310"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5310/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./helpdesk-frontend
      args:
        NEXT_PUBLIC_SOCKET_URL: http://localhost:${PORT:-5310}
    container_name: shagun-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:5310
    ports:
      - "${FRONTEND_PORT:-5311}:5311"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5311/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  shagun_pgdata:
  shagun_redisdata:
  shagun_redpandadata:
